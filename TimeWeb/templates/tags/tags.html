{% extends "base.html" %}

{% block title %}Главная страница сайта{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
<a class="btn btn-primary mb-3" href="{{ url_for('create_tag') }}">Добавить тэг</a>

<h1>Тэги</h1>
    {% for tag in tags %}
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">{{ tag['name'] }}</h5>
                <p class="card-text">{{ tag['count'] }}</p>
            </div>
        </div>
    {% endfor %}
{% endblock %}
