{% extends "base.html" %}

{% block title %}Главная страница сайта{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename= 'css/users.css') }}">
<!--<a href="/create_user">Добавить пользователя</a><br><br>-->
<!--<a href ="/view">Список пользователей</a><br><br>-->
<!--<a href="/delete">Удалить пользователя</a><br><br>-->
<a class="create_user" href="{{ url_for('create_user') }}">+</a>
<h1>Пользователи</h1>
    {% for user in users %}
        <div class="card mb-3">
            <div class="card-body">
                <h2 class="card-title">{{ user['login'] }}</h2>
                <p class="card-text">{{ user['password'] }}</p>
                 <div class="button-group">  <!-- Элемент для размещения кнопок в строку -->
                    <a class="edit" href="{{ url_for('edit_user', login=user['login']) }}">Редактировать</a>
                    <form action="{{ url_for('delete_user', login=user['login']) }}" method="POST" class="d-inline">
                        <button class="delete" type="submit">Удалить</button>
                    </form>
                </div>
            </div>
        </div>
    {% endfor %}
{% endblock %}
